name = "apigate"
main = "packages/gateway/runtimes/cloudflare-worker.ts"
compatibility_date = "2026-05-12"

[vars]
NEW_API_BASE_URL = "https://your-newapi.example.com"
LOG_LEVEL = "info"

# Secrets: set in the Cloudflare dashboard or with `wrangler secret put`
# NEW_API_TOKEN
# ADMIN_PASSWORD
# ADMIN_JWT_SECRET

[assets]
directory = "packages/admin/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/v1/*", "/health"]